description: |
  Common properties of a Basic Radio device. Include-only: each radio
  binding (for example ti,cc23x0-basic-radio.yaml) includes this file and
  adds its device-specific properties.

  A Basic Radio device can operate with multiple PHY configurations. Each
  PHY child selects a waveform mode (via phy-mode). Runtime parameters are
  set via basic_radio_config().

include: [base.yaml]

properties:
  "#address-cells":
    const: 1
  "#size-cells":
    const: 0

child-binding:
  description: |
    One PHY configuration (waveform mode). Selects a PHY from a
    vendor-specific radio-phy-config node via phy-mode.
  properties:
    phy-mode:
      type: phandle
      required: true
      description: |
        Reference to a PHY node in a radio-phy-config node.
        The PHY node defines the waveform (datarate, modulation, etc.)
        and the characterized frequency range.
